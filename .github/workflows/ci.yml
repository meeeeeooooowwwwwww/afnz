name: AFNZ Static Site CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: afnz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate and commit dependency lockfile once
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add npm dependency lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Verify Cloudflare Worker dry-run
        run: npx wrangler deploy --dry-run
