name: Manual Deploy America First .co.nz (independent)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish americafirst.co.nz from this repo"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afnz-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require manual confirmation from main
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prove immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run
      - name: Require AFNZ-specific Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Set CLOUDFLARE_API_TOKEN in afnz repository settings."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in the afnz repository before deploying."
            exit 1
          }
      - name: Deploy only americafirst.co.nz Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "AFNZ isolated deployment $GITHUB_SHA"
      - name: Check own live homepage
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://americafirst.co.nz/ -o "$RUNNER_TEMP/home.html"
          grep -Fqi 'America First' "$RUNNER_TEMP/home.html"
