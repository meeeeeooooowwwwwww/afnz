name: AFNZ Visual Review Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Skip if review already captured
        id: existing
        shell: bash
        run: |
          if [ -f review/home-desktop.png ] && [ -f review/home-mobile.png ] && [ -f review/services-desktop.png ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install app dependencies
        if: steps.existing.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - name: Install Playwright review tooling
        if: steps.existing.outputs.skip != 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start local Worker
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/afnz-review.log 2>&1 &
          echo $! > /tmp/afnz-review.pid
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/afnz-review.log
          exit 1
      - name: Capture desktop and mobile review frames
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p review
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const desktop=await browser.newPage({viewport:{width:1536,height:1024},deviceScaleFactor:1});
          await desktop.goto("http://127.0.0.1:8787/",{waitUntil:"networkidle"});
          await desktop.screenshot({path:"review/home-desktop.png",fullPage:false});
          await desktop.goto("http://127.0.0.1:8787/services",{waitUntil:"networkidle"});
          await desktop.screenshot({path:"review/services-desktop.png",fullPage:false});
          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await mobile.goto("http://127.0.0.1:8787/",{waitUntil:"networkidle"});
          await mobile.screenshot({path:"review/home-mobile.png",fullPage:true});
          await browser.close();
          NODE
      - name: Commit review frames
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/home-desktop.png review/home-mobile.png review/services-desktop.png
          git commit -m "review: capture exact redesign render"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
